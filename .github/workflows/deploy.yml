name: GCP Deployment Pipeline

on:
  push:
    branches: [master]
    paths:
      - "**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: elmanasah/agent_server/agent-api
  WORKING_DIR: .

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-via-ssh:
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create SSH Key File
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to GCP VM
        run: |
          # 1. Copy the production compose file
          scp -i ~/.ssh/id_rsa ${{ env.WORKING_DIR }}/docker-compose.prod.yml ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/agent-api/docker-compose.yml

          # 2. Execute remote Docker commands to pull and restart the service
          ssh -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
            cd /opt/agent-api
            
            # Login to GitHub container registry so the VM can pull the private/public image
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Image name is already hardcoded in compose, no interpolation needed
            
            echo "Pulling latest image..."
            sudo docker compose pull
            
            echo "Restarting containers..."
            sudo docker compose up -d

            echo "Pruning old images..."
            sudo docker image prune -f
          EOF
