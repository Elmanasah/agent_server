name: CI — Build Check

on:
    push:
        branches: ["*"]
    pull_request:
        branches: [master]

jobs:
    test:
        name: Run Unit Tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: testuser
                    POSTGRES_PASSWORD: testpassword
                    POSTGRES_DB: testdb
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test:ci
              env:
                  NODE_ENV: test
                  TEST_DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
                  SECRET_KEY: testsecret
                  GOOGLE_CLOUD_PROJECT: dummy-project-id
                  GOOGLE_CLOUD_LOCATION: us-central1
                  GCS_BUCKET_NAME: dummy-bucket
                  VECTOR_SEARCH_INDEX_ID: dummy-123
                  VECTOR_SEARCH_ENDPOINT_ID: dummy-123
                  EMAIL_USER: dummy@example.com
                  EMAIL_PASS: dummy

    docker-build:
        name: Verify Docker Build
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t agent-api:test .
