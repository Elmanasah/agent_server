name: CI — Build Check

on:
    push:
        branches: ["*"]
    pull_request:
        branches: [master]

jobs:
    docker-build:
        name: Verify Docker Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t agent-api:test .
